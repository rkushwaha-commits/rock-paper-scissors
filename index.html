    <p>Rock Paper Scissors</p>

    <button onclick="

    // this is a code for the Computer Move.
        let computerMove = Math.random();

        if(computerMove>=0 && computerMove<1/3){
            computerMove = 'Rock';
        }
        if(computerMove>=1/3 && computerMove<2/3){
            computerMove = 'Paper';
        }
        if(computerMove>=2/3 && computerMove<1){
            computerMove = 'Scissors';
        }

        let result='';
        if('Rock' === computerMove){
            result = 'Match is Tie.'
        }
        else if('Paper' === computerMove){
            result = 'You lose.'
        }
        else{
            result = 'You won.'
        }

        alert(` You choose Rock. Computer choose ${computerMove}. ${result}  `);



    ">Rock</button>
    <button>Paper</button>
    <button>Scissors</button>

    </script>
