<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <p>Rock Paper Scissors</p>

    <button onclick="
        const computerMove = pickComputerMove();
        // this is the code for the result.

        let result='';
        if('Rock' === computerMove){
            result = 'Match is Tie.'
        }
        else if('Paper' === computerMove){
            result = 'You lose.'
        }
        else{
            result = 'You won.'
        }

        // code for the displaying the result.

        alert(` You choose Rock. Computer choose ${computerMove}. ${result}  `);

    ">Rock</button>
    <button onclick="
        const computerMove = pickComputerMove();

        // this is the code for the result.

        let result='';
        if('Paper' === computerMove){
            result = 'Match is Tie.'
        }
        else if('Scissors' === computerMove){
            result = 'You lose.'
        }
        else{
            result = 'You won.'
        }

        // code for the displaying the result.

        alert(` You choose Paper. Computer choose ${computerMove}. ${result}  `);

    ">Paper</button>
    <button onclick="
        const computerMove = pickComputerMove();

        // this is the code for the result.

        let result='';
        if('Scissors' === computerMove){
            result = 'Match is Tie.'
        }
        else if('Rock' === computerMove){
            result = 'You lose.'
        }
        else{
            result = 'You won.'
        }

        // code for the displaying the result.

        alert(` You choose Scissors. Computer choose ${computerMove}. ${result}  `);

    ">Scissors</button>

    <script>
        function pickComputerMove(){
            let computerMove = Math.random();

        if(computerMove>=0 && computerMove<1/3){
            computerMove = 'Rock';
        }
        else if(computerMove>=1/3 && computerMove<2/3){
            computerMove = 'Paper';
        }
        else if(computerMove>=2/3 && computerMove<1){
            computerMove = 'Scissors';
        }
        return computerMove;
        }
    </script>
    
</body>
</html>
