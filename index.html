<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>

    <button
      onclick="
        const computerMove = pickComputerMove();
        const result = playGame('Rock', computerMove);
        updateScore(result);
        displayScore('Rock', computerMove, result, score);
      "
    >
      Rock
    </button>
    <button
      onclick="
        const computerMove = pickComputerMove();
        const result = playGame('Paper', computerMove);
        updateScore(result);
        displayScore('Paper', computerMove, result, score);
      "
    >
      Paper
    </button>
    <button
      onclick="
        const computerMove = pickComputerMove();
        const result = playGame('Scissors', computerMove);
        updateScore(result);
        displayScore('Scissors', computerMove, result, score);
      "
    >
      Scissors
    </button>
    <button
      onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
      "
    >
      Reset Score
    </button>

    <script>
      function pickComputerMove() {
        let computerMove = Math.random();
        if (computerMove >= 0 && computerMove < 1 / 3) {
          computerMove = "Rock";
        } else if (computerMove >= 1 / 3 && computerMove < 2 / 3) {
          computerMove = "Paper";
        } else if (computerMove >= 2 / 3 && computerMove < 1) {
          computerMove = "Scissors";
        }
        return computerMove;
      }

      function playGame(playerMove, computerMove) {
        let result = "";
        if (playerMove === "Scissors") {
          if (playerMove === computerMove) {
            result = "Match is Tie.";
          } else if ("Rock" === computerMove) {
            result = "You lose.";
          } else {
            result = "You won.";
          }
        } else if (playerMove === "Rock") {
          if (playerMove === computerMove) {
            result = "Match is Tie.";
          } else if ("Paper" === computerMove) {
            result = "You lose.";
          } else {
            result = "You won.";
          }
        } else if (playerMove === "Paper") {
          if (playerMove === computerMove) {
            result = "Match is Tie.";
          } else if ("Scissors" === computerMove) {
            result = "You lose.";
          } else {
            result = "You won.";
          }
        }
        return result;
      }

      let score = JSON.parse(localStorage.getItem("score"));

      if (score === null) {
        score = {
          wins : 0,
          losses : 0,
          ties : 0
        };
      }

      console.log(JSON.parse(localStorage.getItem("score")));

      function updateScore(result) {
        if (result === "You won.") {
          score.wins += 1;
        } else if (result === "You lose.") {
          score.losses += 1;
        } else if (result === "Match is Tie.") {
          score.ties += 1;
        }
        localStorage.setItem("score", JSON.stringify(score));
      }

      function displayScore(myMove, computerMove, result, score) {
        alert(
          `You choose ${myMove}. computer choose ${computerMove}. ${result} \nWins: ${score.wins} ,Losses: ${score.losses} ,Ties: ${score.ties} `,
        );
      }
    </script>
  </body>
</html>
