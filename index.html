<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <p>Rock Paper Scissors</p>

    <button
      onclick="
        const computerMove = pickComputerMove();
        const result = playGame('Rock', computerMove);

        alert(` You choose Rock. Computer choose ${computerMove}. ${result}  `);
      "
    >
      Rock
    </button>
    <button
      onclick="
        const computerMove = pickComputerMove();
        const result = playGame('Paper', computerMove);

        alert(
          ` You choose Paper. Computer choose ${computerMove}. ${result}  `,
        );
      "
    >
      Paper
    </button>
    <button
      onclick="
        const computerMove = pickComputerMove();
        const result = playGame('Scissors', computerMove);

        alert(
          ` You choose Scissors. Computer choose ${computerMove}. ${result}  `,
        );
      "
    >
      Scissors
    </button>

    <script>
      function pickComputerMove() {
        let computerMove = Math.random();
        if (computerMove >= 0 && computerMove < 1 / 3) {
          computerMove = "Rock";
        } else if (computerMove >= 1 / 3 && computerMove < 2 / 3) {
          computerMove = "Paper";
        } else if (computerMove >= 2 / 3 && computerMove < 1) {
          computerMove = "Scissors";
        }
        return computerMove;
      }

      function playGame(playerMove, computerMove) {
        let result = "";
        if (playerMove === "Scissors") {
          if (playerMove === computerMove) {
            result = "Match is Tie.";
          } else if ("Rock" === computerMove) {
            result = "You lose.";
          } else {
            result = "You won.";
          }
        } else if (playerMove === "Rock") {
          if (playerMove === computerMove) {
            result = "Match is Tie.";
          } else if ("Paper" === computerMove) {
            result = "You lose.";
          } else {
            result = "You won.";
          }
        } else if (playerMove === "Paper") {
          if (playerMove === computerMove) {
            result = "Match is Tie.";
          } else if ("Scissors" === computerMove) {
            result = "You lose.";
          } else {
            result = "You won.";
          }
        }
        return result;
      }
    </script>
  </body>
</html>
